name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed and published GitHub release tag
        required: true
        default: v4.0.0-b1
        type: string
      target:
        description: Explicit publication gate
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - production

permissions:
  contents: read

concurrency:
  group: publish-python-${{ inputs.tag }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  prepare:
    name: Verify reviewed GitHub Release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      package-version: ${{ steps.identity.outputs.package-version }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify tag, published release, and package identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-(a|b|rc)([0-9]+)$ ]]; then
            echo "Unsupported prerelease tag: $RELEASE_TAG" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)" = "false"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .tag_name)" = "$RELEASE_TAG"
          VERSION="${BASH_REMATCH[1]}${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
          test "$(python -c 'import sys; sys.path.insert(0, "src"); import arx; print(arx.__version__)')" = "$VERSION"
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')" = "arx-prescanner"
          echo "package-version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Install package verification tooling
        run: python -m pip install "twine>=6,<8" "check-wheel-contents>=0.6,<1"
      - name: Verify release assets and Python package metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-release-assets.py \
            --release-root release-assets \
            --version "${{ steps.identity.outputs.package-version }}" \
            --artifact-version "${RELEASE_TAG#v}"
          python -m twine check --strict release-assets/*.whl release-assets/*.tar.gz
          python -m check_wheel_contents release-assets/*.whl
      - name: Preserve reviewed Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-python-distributions-${{ inputs.tag }}
          path: |
            release-assets/*.whl
            release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish reviewed distributions to existing TestPyPI project
    if: inputs.target == 'testpypi'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/arx-prescanner
    permissions:
      id-token: write
    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-python-distributions-${{ inputs.tag }}
          path: dist
      - name: Publish to TestPyPI with existing Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true

  verify-testpypi:
    name: Verify exact TestPyPI files and isolated installation
    if: inputs.target == 'testpypi'
    needs: [prepare, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out verification code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download reviewed distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-python-distributions-${{ inputs.tag }}
          path: dist
      - name: Compare TestPyPI files and exercise installation
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
        run: |
          set -euo pipefail
          python scripts/verify-python-index.py --index testpypi --version "$PACKAGE_VERSION" --dist-dir dist --retries 12
          VENV="$RUNNER_TEMP/arx-testpypi"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --no-deps \
            --index-url https://test.pypi.org/simple/ "arx-prescanner==$PACKAGE_VERSION"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          test "$("$VENV/bin/python" -c 'import arx; print(arx.__version__)')" = "$PACKAGE_VERSION"
          "$VENV/bin/arx" --help >/dev/null
          "$VENV/bin/arx" quick >/dev/null
          test -x "$VENV/bin/arx-desktop"

  verify-existing-testpypi:
    name: Production gate — verify prior TestPyPI publication
    if: inputs.target == 'production'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out verification code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download reviewed distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-python-distributions-${{ inputs.tag }}
          path: dist
      - name: Require exact files to exist on TestPyPI
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
        run: python scripts/verify-python-index.py --index testpypi --version "$PACKAGE_VERSION" --dist-dir dist

  publish-pypi:
    name: Explicit production PyPI publication
    if: inputs.target == 'production'
    needs: [prepare, verify-existing-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/arx-prescanner
    permissions:
      id-token: write
    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-python-distributions-${{ inputs.tag }}
          path: dist
      - name: Publish to PyPI with existing Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true

  verify-pypi:
    name: Verify exact production PyPI files
    if: inputs.target == 'production'
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Check out verification code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download reviewed distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-python-distributions-${{ inputs.tag }}
          path: dist
      - name: Compare production PyPI files with reviewed release assets
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
        run: python scripts/verify-python-index.py --index pypi --version "$PACKAGE_VERSION" --dist-dir dist --retries 12

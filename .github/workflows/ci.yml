name: ARX CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ARX development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Enforce ARX dependency boundaries
        run: python scripts/check-architecture.py
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pytest --ignore=tests/test_desktop.py --ignore=tests/test_desktop_advisory.py --ignore=tests/test_desktop_provider_settings.py --ignore=tests/test_desktop_ux.py
          python scripts/run-isolated-gui-tests.py
      - name: Run tests on Linux under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

  package:
    name: Verify source and wheel builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package verification tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "build>=1.2,<2" "twine>=6,<8" "check-wheel-contents>=0.6,<1"
      - name: Scan tracked release inputs for credential-shaped material
        run: python scripts/scan-tracked-secrets.py
      - name: Build source distribution and wheel
        run: python -m build
      - name: Validate package metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Inspect wheel contents
        run: python -m check_wheel_contents dist/*.whl
      - name: Install and exercise the built wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import arx, os, pathlib; origin=pathlib.Path(arx.__file__).resolve(); assert not origin.is_relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()); assert arx.__version__ == '4.0.0b1'; print(arx.__version__, origin)"
          arx --help >/dev/null
          arx quick >/dev/null
          command -v arx-desktop

name: Trusted installation preflight

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or future prerelease tag to evaluate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or future prerelease tag to evaluate
        required: true
        default: arx4-trusted-installation
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: trusted-installation-preflight-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Build, verify, and attest unsigned candidates
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked release Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Conda = Join-Path $env:CONDA 'Scripts\conda.exe'
          if (-not (Test-Path -LiteralPath $Conda -PathType Leaf)) {
              throw 'The documented GitHub Windows image Miniconda installation is unavailable.'
          }
          $PythonRoot = Join-Path $env:RUNNER_TEMP 'arx-release-python'
          & $Conda create --yes --quiet --prefix $PythonRoot --override-channels --channel defaults python=3.12.13 pip
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to provision the locked CPython 3.12.13 release environment (exit $LASTEXITCODE)."
          }
          $Python = Join-Path $PythonRoot 'python.exe'
          $Identity = & $Python -c "import platform, struct; print(platform.python_version()); print(struct.calcsize('P') * 8)"
          if ($LASTEXITCODE -ne 0 -or $Identity.Count -ne 2 -or $Identity[0] -ne '3.12.13' -or $Identity[1] -ne '64') {
              throw "Release Python identity mismatch: $($Identity -join ' / ')."
          }
          $RuntimeBin = Join-Path $PythonRoot 'Library\bin'
          foreach ($Runtime in @('ffi.dll', 'tcl86t.dll', 'tk86t.dll')) {
              if (-not (Test-Path -LiteralPath (Join-Path $RuntimeBin $Runtime) -PathType Leaf)) {
                  throw "The locked release Python is missing required desktop runtime $Runtime."
              }
          }
          $PythonRoot | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $PythonRoot 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $RuntimeBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CONDA_PREFIX=$PythonRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install release and audit tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --requirement packaging/release-build-requirements.txt
          python -m pip install "pip-audit==2.10.1" "bandit==1.9.4"

      - name: Record path-free build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Candidates = @(
              (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue).Source,
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          $Iscc = $Candidates | Select-Object -First 1
          if (-not $Iscc) {
              throw 'Inno Setup compiler identity cannot be recorded.'
          }
          $Products = @()
          foreach ($Root in @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )) {
              if (Test-Path -LiteralPath $Root) {
                  foreach ($Key in Get-ChildItem -LiteralPath $Root) {
                      $Product = Get-ItemProperty -LiteralPath $Key.PSPath
                      if ($Product.DisplayName -like 'Inno Setup *' -and $Product.DisplayVersion -match '^\d+\.\d+\.\d+$') {
                          $Products += $Product
                      }
                  }
              }
          }
          $InnoVersions = @($Products | Select-Object -ExpandProperty DisplayVersion -Unique)
          if ($InnoVersions.Count -ne 1) {
              throw "Unable to establish one Inno Setup version: $($InnoVersions -join ', ')"
          }
          $Epoch = .\scripts\resolve-source-date-epoch.ps1 -ProjectRoot $env:GITHUB_WORKSPACE
          python scripts/write-build-environment.py `
            --output "$env:RUNNER_TEMP\release-build-environment.json" `
            --builder-label "github-independent-preflight-$env:GITHUB_RUN_ID" `
            --source-commit (git rev-parse HEAD) `
            --source-date-epoch $Epoch `
            --inno-setup-version $InnoVersions[0]

      - name: Compile, architecture, tests, and tracked-secret scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q src tests scripts
          python scripts/check-architecture.py
          python -m pytest --ignore=tests/test_desktop.py --ignore=tests/test_desktop_advisory.py --ignore=tests/test_desktop_local_ai.py --ignore=tests/test_desktop_provider_settings.py --ignore=tests/test_desktop_ux.py
          python scripts/run-isolated-gui-tests.py
          python scripts/scan-tracked-secrets.py

      - name: Dependency audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force security-results | Out-Null
          python -m pip_audit -f json -o security-results/pip-audit.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pip-audit reported findings. Preserve the report for review."
          }
          exit 0

      - name: Bandit SAST
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          bandit -r src -f json -o security-results/bandit.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Bandit reported findings. Preserve the report for review."
          }
          exit 0

      - name: Build unsigned release candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = python -c "import sys; sys.path.insert(0, 'src'); import arx; print(arx.__version__)"
          .\scripts\build-release.ps1 -Version $Version -AllowMissingInstaller
          "PACKAGE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify Python distributions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Get-ChildItem release -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          python -m twine check --strict "$($Root.FullName)\*.whl" "$($Root.FullName)\*.tar.gz"
          python -m check_wheel_contents "$($Root.FullName)\*.whl"

      - name: Verify candidates are unsigned before human signing gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Get-ChildItem release -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $Exe = Get-Item -LiteralPath "$($Root.FullName)\ARX-Desktop-win-x64\ARX.exe"
          $Status = (Get-AuthenticodeSignature -LiteralPath $Exe.FullName).Status
          if ($Status -ne 'NotSigned') {
            throw "Preflight expected an unsigned candidate but ARX.exe status is $Status"
          }
          $Installer = Get-ChildItem -LiteralPath $Root.FullName -File -Filter 'ARX-Desktop-Setup-win-x64-*.exe' | Select-Object -First 1
          if ($Installer) {
            $InstallerStatus = (Get-AuthenticodeSignature -LiteralPath $Installer.FullName).Status
            if ($InstallerStatus -ne 'NotSigned') {
              throw "Preflight expected an unsigned installer candidate but status is $InstallerStatus"
            }
          }

      - name: Require complete desktop runtime and smoke-test unsigned portable candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Get-ChildItem release -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $Portable = Join-Path $Root.FullName 'ARX-Desktop-win-x64'
          $Executable = Join-Path $Portable 'ARX.exe'
          $Internal = Join-Path $Portable '_internal'
          foreach ($Runtime in @('ffi.dll', 'tcl86t.dll', 'tk86t.dll')) {
              if (-not (Test-Path -LiteralPath (Join-Path $Internal $Runtime) -PathType Leaf)) {
                  throw "Unsigned portable runtime is incomplete: missing $Runtime."
              }
          }
          $Target = Join-Path $env:SystemRoot 'System32\notepad.exe'
          $Cases = @(
              @{ Mode = '--smoke-test'; Name = 'controller' },
              @{ Mode = '--ui-smoke-test'; Name = 'ui' }
          )
          foreach ($Case in $Cases) {
              $Output = Join-Path $env:RUNNER_TEMP "preflight-$($Case.Name)-smoke.json"
              $Process = Start-Process -FilePath $Executable `
                  -ArgumentList @($Case.Mode, $Target, $Output) `
                  -WindowStyle Hidden -PassThru
              if (-not $Process.WaitForExit(240000)) {
                  Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
                  throw "Unsigned portable $($Case.Name) smoke test timed out."
              }
              $Process.Refresh()
              if ($Process.ExitCode -ne 0) {
                  throw "Unsigned portable $($Case.Name) smoke test exited $($Process.ExitCode)."
              }
              foreach ($Expected in @($Output, "$Output.result.json")) {
                  if (-not (Test-Path -LiteralPath $Expected -PathType Leaf)) {
                      throw "Unsigned portable $($Case.Name) smoke test did not produce $Expected."
                  }
              }
          }

      - name: Stage unsigned candidates for review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Get-ChildItem release -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $Stage = Join-Path $env:RUNNER_TEMP 'trusted-installation-preflight'
          New-Item -ItemType Directory -Force $Stage | Out-Null
          Get-ChildItem -LiteralPath $Root.FullName -File | Copy-Item -Destination $Stage
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\release-build-environment.json" -Destination $Stage
          if (Test-Path -LiteralPath "$($Root.FullName)\ARX-Desktop-win-x64") {
            Compress-Archive -Path "$($Root.FullName)\ARX-Desktop-win-x64" -DestinationPath (Join-Path $Stage 'ARX-Desktop-win-x64-preflight.zip') -Force
          }
          Get-ChildItem -LiteralPath $Stage -File | ForEach-Object {
            $h = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($h.Hash)  $($_.Name)"
          } | Set-Content -LiteralPath (Join-Path $Stage 'PRE_SIGN_SHA256SUMS.txt') -Encoding ascii

      - name: Upload unsigned preflight bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-installation-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/trusted-installation-preflight/*
          if-no-files-found: error
          retention-days: 7

      - name: Attest unsigned preflight subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/trusted-installation-preflight/*

      - name: Human signing gate reminder
        shell: pwsh
        run: |
          @'
          TRUSTED INSTALLATION PREFLIGHT COMPLETE.

          This workflow intentionally DOES NOT:
          - sign ARX.exe
          - sign the installer
          - modify a release
          - publish GitHub release assets
          - publish PyPI/TestPyPI
          - install certificates into Windows trust stores

          Production signing must occur only in a separate protected workflow/environment
          after explicit human approval and after a real trusted signing identity is configured.
          '@ | Write-Host

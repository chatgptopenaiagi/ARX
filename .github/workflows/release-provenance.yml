name: Verify and attest GitHub release provenance

on:
  workflow_call:
    inputs:
      tag:
        description: Existing ARX 4 draft or public prerelease tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing ARX 4 draft or public prerelease tag
        required: true
        default: v4.0.0-b3
        type: string

permissions:
  # GitHub exposes draft releases only to identities with push access.
  # This workflow never calls a release mutation command; the permission is
  # required solely to read and download the human-gated draft subjects.
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-provenance-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  reproduce-and-attest:
    name: Reproduce, verify, and attest exact release identities
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked release Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Conda = Join-Path $env:CONDA 'Scripts\conda.exe'
          if (-not (Test-Path -LiteralPath $Conda -PathType Leaf)) {
              throw 'The documented GitHub Windows image Miniconda installation is unavailable.'
          }
          $PythonRoot = Join-Path $env:RUNNER_TEMP 'arx-release-python'
          & $Conda create --yes --quiet --prefix $PythonRoot --override-channels --channel defaults python=3.12.13 pip
          if ($LASTEXITCODE -ne 0) {
              throw "Unable to provision the locked CPython 3.12.13 release environment (exit $LASTEXITCODE)."
          }
          $Python = Join-Path $PythonRoot 'python.exe'
          $Identity = & $Python -c "import platform, struct; print(platform.python_version()); print(struct.calcsize('P') * 8)"
          if ($LASTEXITCODE -ne 0 -or $Identity.Count -ne 2 -or $Identity[0] -ne '3.12.13' -or $Identity[1] -ne '64') {
              throw "Release Python identity mismatch: $($Identity -join ' / ')."
          }
          $RuntimeBin = Join-Path $PythonRoot 'Library\bin'
          foreach ($Runtime in @('ffi.dll', 'tcl86t.dll', 'tk86t.dll')) {
              if (-not (Test-Path -LiteralPath (Join-Path $RuntimeBin $Runtime) -PathType Leaf)) {
                  throw "The locked release Python is missing required desktop runtime $Runtime."
              }
          }
          $PythonRoot | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $PythonRoot 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $RuntimeBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CONDA_PREFIX=$PythonRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify release and source identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(?<base>\d+\.\d+\.\d+)-(?<kind>a|b|rc)(?<number>\d+)$') {
              throw "Unsupported prerelease tag: $env:RELEASE_TAG"
          }
          $Releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          $Matches = @(
              $Releases | Where-Object {
                  $_.tag_name -ceq $env:RELEASE_TAG -and $_.prerelease -eq $true
              }
          )
          if ($Matches.Count -ne 1) {
              throw 'Provenance requires exactly one matching draft or public prerelease.'
          }
          $Release = $Matches[0]
          if ((git rev-parse HEAD) -ne (git rev-list -n 1 $env:RELEASE_TAG)) {
              throw 'Checkout does not resolve to the release tag commit.'
          }
          $Version = python -c "import sys; sys.path.insert(0, 'src'); import arx; print(arx.__version__)"
          $Expected = "$($Matches['base'])$($Matches['kind'])$($Matches['number'])"
          if ($Version -ne $Expected) {
              throw "Package version $Version does not match $env:RELEASE_TAG."
          }
          "PACKAGE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_VERSION=$($env:RELEASE_TAG.Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_COMMIT=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the exact release toolchain
        run: python -m pip install --disable-pip-version-check --requirement packaging/release-build-requirements.txt

      - name: Download and validate the complete release candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\published" -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP\published"
          python scripts/verify-release-assets.py `
            --release-root "$env:RUNNER_TEMP\published" `
            --version $env:PACKAGE_VERSION `
            --artifact-version $env:ARTIFACT_VERSION `
            --require-security-bundle

      - name: Independently rebuild exact core artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build-release.ps1 `
            -PythonExecutable python `
            -Version $env:PACKAGE_VERSION `
            -ReleaseRoot "$env:GITHUB_WORKSPACE\release\reproduced"

      - name: Require complete reproduced desktop runtime and smoke-test it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Portable = "$env:GITHUB_WORKSPACE\release\reproduced\ARX-Desktop-win-x64"
          $Executable = Join-Path $Portable 'ARX.exe'
          $Internal = Join-Path $Portable '_internal'
          foreach ($Runtime in @('ffi.dll', 'tcl86t.dll', 'tk86t.dll')) {
              if (-not (Test-Path -LiteralPath (Join-Path $Internal $Runtime) -PathType Leaf)) {
                  throw "Reproduced portable runtime is incomplete: missing $Runtime."
              }
          }
          $Target = Join-Path $env:SystemRoot 'System32\notepad.exe'
          $Cases = @(
              @{ Mode = '--smoke-test'; Name = 'controller' },
              @{ Mode = '--ui-smoke-test'; Name = 'ui' }
          )
          foreach ($Case in $Cases) {
              $Output = Join-Path $env:RUNNER_TEMP "reproduced-$($Case.Name)-smoke.json"
              $Process = Start-Process -FilePath $Executable `
                  -ArgumentList @($Case.Mode, $Target, $Output) `
                  -WindowStyle Hidden -PassThru
              if (-not $Process.WaitForExit(240000)) {
                  Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue
                  throw "Reproduced portable $($Case.Name) smoke test timed out."
              }
              $Process.Refresh()
              if ($Process.ExitCode -ne 0) {
                  throw "Reproduced portable $($Case.Name) smoke test exited $($Process.ExitCode)."
              }
              foreach ($Expected in @($Output, "$Output.result.json")) {
                  if (-not (Test-Path -LiteralPath $Expected -PathType Leaf)) {
                      throw "Reproduced portable $($Case.Name) smoke test did not produce $Expected."
                  }
              }
          }

      - name: Require bit-for-bit equality for every core release artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Names = @(
              "arx_prescanner-$env:PACKAGE_VERSION-py3-none-any.whl",
              "arx_prescanner-$env:PACKAGE_VERSION.tar.gz",
              "ARX-Desktop-win-x64-v$env:ARTIFACT_VERSION.zip",
              "ARX-Desktop-Setup-win-x64-v$env:ARTIFACT_VERSION.exe"
          )
          $Records = foreach ($Name in $Names) {
              $Published = Join-Path "$env:RUNNER_TEMP\published" $Name
              $Rebuilt = Join-Path "$env:GITHUB_WORKSPACE\release\reproduced" $Name
              if (-not (Test-Path -LiteralPath $Published -PathType Leaf) -or -not (Test-Path -LiteralPath $Rebuilt -PathType Leaf)) {
                  throw "Missing published or rebuilt core artifact: $Name"
              }
              $PublishedHash = (Get-FileHash -LiteralPath $Published -Algorithm SHA256).Hash.ToLowerInvariant()
              $RebuiltHash = (Get-FileHash -LiteralPath $Rebuilt -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($PublishedHash -ne $RebuiltHash) {
                  throw "Core artifact is not bit-for-bit reproducible: $Name"
              }
              [ordered]@{ artifact = $Name; sha256 = $PublishedHash; result = 'BIT_FOR_BIT_REPRODUCIBLE' }
          }
          $Records | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP\core-reproduction.json" -Encoding utf8

      - name: Reproduce and compare CycloneDX SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Python = (Get-Command python -ErrorAction Stop).Source
          $Wheel = "$env:GITHUB_WORKSPACE\release\reproduced\arx_prescanner-$env:PACKAGE_VERSION-py3-none-any.whl"
          $Sbom = "$env:RUNNER_TEMP\ARX-$env:ARTIFACT_VERSION-SBOM.cdx.json"
          $Scratch = Join-Path $env:RUNNER_TEMP 'arx-provenance-sbom'
          if (Test-Path -LiteralPath $Scratch) {
              throw 'Refusing to reuse provenance SBOM scratch storage.'
          }
          & $Python -m venv --without-pip $Scratch
          if ($LASTEXITCODE -ne 0) {
              throw "Provenance SBOM virtual environment creation failed with exit code $LASTEXITCODE."
          }
          $ScratchPython = Join-Path $Scratch 'Scripts\python.exe'
          $SiteDirectory = & $ScratchPython -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          if ($LASTEXITCODE -ne 0 -or -not $SiteDirectory) {
              throw 'Unable to resolve the isolated provenance SBOM site-packages directory.'
          }
          & $Python -m pip install --disable-pip-version-check --no-deps --target $SiteDirectory $Wheel
          if ($LASTEXITCODE -ne 0) {
              throw "Isolated wheel installation for provenance SBOM failed with exit code $LASTEXITCODE."
          }
          & $Python -m cyclonedx_py environment $ScratchPython `
              --pyproject "$env:GITHUB_WORKSPACE\pyproject.toml" `
              --mc-type application --spec-version 1.6 --output-reproducible `
              --output-format JSON --output-file $Sbom --validate
          if ($LASTEXITCODE -ne 0) {
              throw "Provenance CycloneDX generation or validation failed with exit code $LASTEXITCODE."
          }
          $Published = "$env:RUNNER_TEMP\published\ARX-$env:ARTIFACT_VERSION-SBOM.cdx.json"
          if ((Get-FileHash $Sbom -Algorithm SHA256).Hash -ne (Get-FileHash $Published -Algorithm SHA256).Hash) {
              throw 'Published CycloneDX SBOM is not bit-for-bit reproducible.'
          }

      - name: Reproduce and compare complete checksum manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $RebuiltManifest = "$env:RUNNER_TEMP\SHA256SUMS.txt"
          python scripts/write-public-checksums.py --release-root "$env:RUNNER_TEMP\published" --output $RebuiltManifest
          if ((Get-FileHash $RebuiltManifest -Algorithm SHA256).Hash -ne (Get-FileHash "$env:RUNNER_TEMP\published\SHA256SUMS.txt" -Algorithm SHA256).Hash) {
              throw 'Published checksum manifest is not exactly reproducible.'
          }

      - name: Stage complete validated release subjects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Stage = "$env:RUNNER_TEMP\attestation-subjects"
          New-Item -ItemType Directory -Path $Stage -Force | Out-Null
          Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\published" -File | Copy-Item -Destination $Stage
          $Names = @(
              "arx_prescanner-$env:PACKAGE_VERSION-py3-none-any.whl",
              "arx_prescanner-$env:PACKAGE_VERSION.tar.gz",
              "ARX-Desktop-win-x64-v$env:ARTIFACT_VERSION.zip",
              "ARX-Desktop-Setup-win-x64-v$env:ARTIFACT_VERSION.exe"
          )
          foreach ($Name in $Names) {
              Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\release\reproduced\$Name" -Destination "$Stage\$Name" -Force
          }
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\ARX-$env:ARTIFACT_VERSION-SBOM.cdx.json" -Destination $Stage -Force
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\SHA256SUMS.txt" -Destination $Stage -Force
          $PublishedNames = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\published" -File | Select-Object -ExpandProperty Name | Sort-Object)
          $StagedNames = @(Get-ChildItem -LiteralPath $Stage -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object -ReferenceObject $PublishedNames -DifferenceObject $StagedNames) {
              throw 'Attestation subjects do not exactly match the complete validated release file set.'
          }

      - name: Attest exact independently reproduced subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attestation-subjects/*
          show-summary: true

      - name: Preserve provenance verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-verification-${{ inputs.tag }}
          path: ${{ runner.temp }}/core-reproduction.json
          if-no-files-found: error
          retention-days: 90

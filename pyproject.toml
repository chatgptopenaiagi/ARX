[build-system]
requires = ["setuptools>=63"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-prescanner"
version = "2.0.0"
description = "ARX project-aware semantic compatibility intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23"]
build = ["pyinstaller>=6.22"]

[project.scripts]
arx = "arx.cli:main"
arx-desktop = "arx.desktop.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: deterministic component integration tests",
    "live_workstation: opt-in acceptance tests that inspect the current workstation",
]

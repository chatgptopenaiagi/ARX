[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-prescanner"
version = "4.0.0b1"
description = "ARX 4 — Project-Aware Compatibility Intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["windows", "compatibility", "static-analysis", "developer-tools", "project-dna"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/chatgptopenaiagi/ARX"
Documentation = "https://github.com/chatgptopenaiagi/ARX#readme"
Source = "https://github.com/chatgptopenaiagi/ARX"
Issues = "https://github.com/chatgptopenaiagi/ARX/issues"
Changelog = "https://github.com/chatgptopenaiagi/ARX/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23", "build>=1.2"]
build = ["pyinstaller>=6.22"]
release = ["build>=1.2,<2", "twine>=6,<8", "check-wheel-contents>=0.6,<1"]

[project.scripts]
arx = "arx.cli:main"
arx-desktop = "arx.desktop.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: deterministic component integration tests",
    "live_workstation: opt-in acceptance tests that inspect the current workstation",
]
